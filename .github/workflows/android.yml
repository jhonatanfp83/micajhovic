# Compila la app Android MCJV en la nube (no hace falta tener Android Studio).
# - En pull requests: solo verifica que compile.
# - En push a main o a mano (Run workflow): publica el APK en la release "app-movil".
name: Android-APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/MCJVAPP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MCJV-APP.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MCJV-APP
          path: mobile/MCJVAPP/MCJV-APP.apk

      - name: Publicar APK en la release app-movil
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-movil
          name: App móvil MCJV (última versión)
          body: |
            APK de la app MCJV compilado automáticamente desde `main`.
            Descárgalo desde el celular, ábrelo y permite "instalar apps de origen desconocido".
            La app usa el servidor https://micajhovic-api.onrender.com
          files: mobile/MCJVAPP/MCJV-APP.apk
          make_latest: true
